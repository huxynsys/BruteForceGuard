# Production reverse proxy for BruteForceGuard (Phase 9.4).
#
#   * serves the built React dashboard from /usr/share/nginx/html
#   * proxies /api/* to the FastAPI backend over the internal Docker network
#   * passes /health and /health/ready through for readiness probes
#   * adds baseline security headers that do not break the dashboard
#
# Only this container publishes a port; the backend and PostgreSQL are
# reachable exclusively on the internal network.

upstream bfg_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --- Baseline security headers ------------------------------------
    # Inherited by every location that does not define its own add_header.
    # The CSP allows the dashboard bundle plus the Google Fonts used by
    # index.html; everything else must be same-origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'" always;

    # --- Container healthcheck (self-contained, no backend dependency) --
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Readiness / liveness pass-through ----------------------------
    location = /health {
        access_log off;
        proxy_pass http://bfg_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://bfg_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # --- API -----------------------------------------------------------
    location /api/ {
        proxy_pass http://bfg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- Static dashboard ----------------------------------------------
    # Immutable hashed assets get a long cache lifetime; `expires` is used
    # instead of add_header so the server-level security headers still apply.
    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}