services:
  postgres:
    image: postgres:17
    container_name: bruteforceguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bruteforceguard
      POSTGRES_USER: bfg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfg_user -d bruteforceguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: bruteforceguard-backend
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

volumes:
  postgres_data: